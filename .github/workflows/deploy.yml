# Publica o site no GitHub Pages a cada push para main.
# Configuração necessária no repositório: Settings → Pages → Source: «GitHub Actions».
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez; não cancela uma publicação em curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium para os testes
        run: npx playwright install --with-deps chromium

      # Testes unitários → validação de conteúdo → build → ligações → testes no navegador.
      - name: Testar e construir
        run: npm run ci
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Guardar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Só corre se o build e todos os testes passarem; caso contrário, o site publicado não muda.
  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
